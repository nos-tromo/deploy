# Values several members must hold alike. `make env` (scripts/env_sync.py)
# checks them across the members' .env files, fills an unset side from the
# side that is set, reports two different values as a conflict, and generates
# a missing secret only with ENV_GENERATE=1. Values are never printed.
# Runbook: docs/runbooks/env-sync.md (Shared values).
#
# One row per member and key: GROUP MEMBER KEY [FLAG ...]
#   source      the authority: its line counts as set even when it holds the
#               example's value
#   gen         ENV_GENERATE=1 generates a value when the group is unset in
#               every member
#   entry=NAME  the key holds a NAME=token,... list; NAME's token is shared
#
# A new or renamed shared key in a member's .env.example means an edit here.

edge-host        edge-plane          EDGE_HOST                      source
edge-host        obs-plane           EDGE_HOST
edge-host        open-webui-service  EDGE_HOST
docint-edge      edge-plane          DOCINT_EDGE_SECRET             gen
docint-edge      docint              DOCINT_EDGE_SECRET             gen
nextext-edge     edge-plane          NEXTEXT_EDGE_SECRET            gen
nextext-edge     Nextext             NEXTEXT_EDGE_SECRET            gen
translator-edge  edge-plane          TRANSLATOR_EDGE_SECRET         gen
translator-edge  translator          TRANSLATOR_EDGE_SECRET         gen
open-webui-edge  edge-plane          OPEN_WEBUI_EDGE_SECRET         gen
open-webui-edge  open-webui-service  OPEN_WEBUI_EDGE_SECRET         gen
grafana-edge     edge-plane          GRAFANA_EDGE_SECRET            gen
grafana-edge     obs-plane           GRAFANA_EDGE_SECRET            gen
audit-edge       edge-plane          AUDIT_EDGE_SECRET              gen
audit-edge       obs-plane           AUDIT_EDGE_SECRET              gen
qdrant-key       data-plane          QDRANT_API_KEY                 gen
qdrant-key       docint              QDRANT_API_KEY                 gen
openwebui-jwt    open-webui-service  OPEN_WEBUI_FORWARD_JWT_SECRET  gen
openwebui-jwt    vllm-service        AUDIT_OPENWEBUI_JWT_SECRET     gen
nextext-token    docint              NEXTEXT_API_KEY                gen
nextext-token    Nextext             NEXTEXT_SERVICE_TOKENS         gen entry=docint
router-key       vllm-service        OPENAI_API_KEY                 source
router-key       docint              OPENAI_API_KEY
router-key       Nextext             OPENAI_API_KEY
router-key       translator          OPENAI_API_KEY
router-key       open-webui-service  OPENAI_API_KEY
