name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # shellcheck (scripts/*.sh) + yamllint come from the shared infra-validation
  # workflow. The other jobs skip automatically: compose-config because deploy
  # passes no compose-files (it owns no compose, it only sequences the members');
  # hadolint because there are no Dockerfiles; make-common because deploy does
  # not vendor make/common.mk.
  validate:
    uses: nos-tromo/.github/.github/workflows/infra-validation.yml@2715bedabe594a449e411182393e68da59c791f3 # v3.22

  # Bespoke and intentionally not shared — no reusable workflow covers it:
  # validates that the orchestration Makefile parses (`make help`) and that the
  # $(call compose,...) helper expands (`make -n ps`, which has no sub-make
  # prerequisites so it needs none of the member repos present on the runner).
  makefile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Makefile parses + compose helper expands
        run: |
          make help >/dev/null
          make -n ps >/dev/null
          make -n env >/dev/null
          make -n env-check >/dev/null
          test ! -e .env-sync
          echo "Makefile OK"

  # Packs and unpacks synthetic Hugging Face caches (both blob layouts, a
  # dangling link, an archive without its weights) through the model-transfer
  # scripts. No network, no real model.
  model-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pack/unpack round trip
        run: |
          command -v zstd >/dev/null || { sudo apt-get update && sudo apt-get install -y zstd; }
          bash tests/model-transfer.test.sh

  # The env sync (scripts/env_sync.py): unit and end-to-end tests on the
  # Python floor (3.9, RHEL 9's system Python) and a current one.
  env-sync:
    runs-on: ubuntu-24.04  # newest image with a Python 3.9 build
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile and test
        run: |
          python -m py_compile scripts/env_sync.py scripts/check_env_examples.py scripts/envsync/*.py
          python -B -m unittest discover -s tests -p 'test_*.py' -v
